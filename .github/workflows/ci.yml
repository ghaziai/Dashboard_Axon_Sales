name: Axon Sales CI

on:
  push:
    branches:
      - main
      - Testing
      - Deployment
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        # No Supabase env vars are set here on purpose: every route is
        # server-rendered on demand (no cookies()-based route is prerendered),
        # so `next build` never touches Supabase -- verified locally by
        # running the build with .env.local removed before wiring this up.

      - name: Data validation
        run: npm run test:validation
        env:
          # Repo Variables, not Secrets -- these are the same public anon
          # key/URL already shipped to the browser (see docs/deployment.md),
          # safe to expose in workflow logs. RLS is open for anon (read),
          # so no service-role credential is needed to run these checks.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
